messages:
  prefix: "<dark_gray>[<gold>FailChestLock</gold>]</dark_gray> "

  # Nadpisy menu
  title-enter: "<dark_gray>Zadej kód"
  title-set: "<dark_gray>Nastav kód"
  title-repeat: "<dark_gray>Zopakuj kód"
  title-owner: "<dark_gray>Zámek chestky"
  title-trusted: "<dark_gray>Důvěryhodní hráči"
  title-remove: "<dark_gray>Odebrat zámek?"

  # Itemy v menu
  item-digit: "<white><bold>%digit%"
  item-digit-lore: "<gray>Klikni pro zadání"
  item-del: "<red>Smazat číslici"
  item-ok: "<green>Potvrdit"
  item-code-filled: "<green>*"
  item-code-empty: "<gray>_"
  item-change-code: "<gold>Změnit kód"
  item-change-code-lore: "<gray>Nastav nový kód chestky"
  item-trusted: "<aqua>Důvěryhodní hráči"
  item-trusted-lore: "<gray>Tito hráči nemusí zadávat kód"
  item-trusted-count: "<gray>Počet: <white>%count%"
  item-remove: "<red>Odebrat zámek"
  item-remove-lore: "<gray>Chestka bude otevřená pro všechny"
  item-close: "<red>Zavřít"
  item-back: "<yellow>Zpět"
  item-yes: "<green>Ano, odebrat zámek"
  item-no: "<red>Ne, ponechat"
  item-trusted-on: "<green>Důvěryhodný <gray>(klikni pro odebrání)"
  item-trusted-off: "<gray>Klikni pro přidání"

  # Zpravy v chatu
  wrong-code: "<red>Špatný kód. Zbývající pokusy: <white>%left%"
  locked-out: "<red>Příliš mnoho pokusů. Zkus to znovu za <white>%time%s</white>."
  code-too-short: "<red>Kód musí mít alespoň <white>%min%</white> číslic."
  code-mismatch: "<red>Kódy se neshodují, zkus to znovu."
  code-set: "<green>Chestka je zamčená. Ty ji otevřeš bez kódu."
  code-changed: "<green>Kód chestky byl změněn."
  lock-removed: "<yellow>Zámek byl odebrán."
  lock-skipped: "<gray>Chestka zůstala odemčená. Zamkneš ji později: Shift + pravý klik s tripwire hookem v ruce."
  break-denied: "<red>Tuhle chestku může rozbít jen její majitel."
  place-denied: "<red>Tuhle chestku nejde připojit k cizí zamčené chestce. Postav ji jinde nebo se Shiftem."
