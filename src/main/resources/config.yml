# FailChestLock - by Failxos (Minecraft 1.21.11)
# Vse se ovlada pres GUI, plugin nema zadne prikazy.
# Zpravy pouzivaji MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Permission failchestlock.bypass otevre/rozbije jakoukoliv zamcenou chestku.

# Co jde zamknout
lockable:
  - CHEST
  - TRAPPED_CHEST
  - BARREL

code:
  min-length: 4
  max-length: 6

# Po zadani spravneho kodu je chestka odemcena na tuto dobu (minuty)
unlock-minutes: 5

# Spatne pokusy: po max-attempts spatnych kodech je hrac zablokovan na lockout-seconds
max-attempts: 3
lockout-seconds: 60

# Po polozeni chestky se hned otevre menu pro nastaveni kodu
auto-prompt-on-place: true

# Item, kterym se (se Shiftem + pravy klik) zamkne uz stojici chestka. Prazdne = vypnuto.
lock-tool: TRIPWIRE_HOOK

# Ochrany
protect:
  hoppers: true      # hopper nic nevytahne ani nevlozi
  explosions: true   # vybuchy zamcene chestky neznici

# Napojeni na ItemsAdder: misto vanilla itemu v menu muzes pouzit vlastni ikony.
# Do kazde polozky napis namespace:item_id (napr. "myicons:digit_5"). Prazdne = vanilla item.
# Nazvy a popisky itemu zustavaji z "messages" nize, ItemsAdder dodava jen vzhled.
# Funguje i bez ItemsAdderu (pak se pouziji vanilla itemy).
itemsadder:
  enabled: true
  icons:
    digit-0: ""
    digit-1: ""
    digit-2: ""
    digit-3: ""
    digit-4: ""
    digit-5: ""
    digit-6: ""
    digit-7: ""
    digit-8: ""
    digit-9: ""
    del: ""
    ok: ""
    code-filled: ""
    code-empty: ""
    filler: ""
    change-code: ""
    trusted: ""
    remove: ""
    close: ""
    back: ""
    yes: ""
    no: ""

