# FailChestLock by Failxos (Minecraft 1.21.11)
# Chest locks with a code. Everything is controlled through menus, the plugin has no commands.
# All texts live in plugins/FailChestLock/lang/<language>.yml
# The permission failchestlock.bypass lets a player open and break any locked chest.

# Language of all messages and menus. Restart the server after changing it.
# Bundled: en, zh, hi, es, fr, ar, bn, pt, ru, ur, id, de, ja, tr, vi, ko, it, te, mr, ta, cs, sk
# To add your own language, create lang/<code>.yml and put the code here.
# Keys missing in a language file fall back to English.
language: en

# Blocks that can be locked
lockable:
  - CHEST
  - TRAPPED_CHEST
  - BARREL

code:
  min-length: 4
  max-length: 6

# Default code: a player enters a code on their first chest, every chest placed
# afterwards is locked with the same code automatically (no menu).
default-code:
  enabled: true
  # true = removing a lock also deletes the player's default code
  # false = removing a lock only affects that one chest
  clear-on-remove: false

# After a correct code the chest stays unlocked for this many minutes
unlock-minutes: 5

# After max-attempts wrong codes the player is blocked for lockout-seconds
max-attempts: 3
lockout-seconds: 60

# Open the code menu right after placing a chest (only when the player has no default code yet)
auto-prompt-on-place: true

# Item used (Shift + right-click) to lock an existing chest. Empty = disabled.
lock-tool: TRIPWIRE_HOOK

protect:
  hoppers: true      # hoppers can't take items from or put items into locked chests
  explosions: true   # explosions don't destroy locked chests

# ItemsAdder icons (optional). Put namespace:item_id for any button, empty = vanilla item.
# Names and descriptions still come from the language file, ItemsAdder only provides the look.
# Works without ItemsAdder installed (vanilla items are used then).
itemsadder:
  enabled: true
  icons:
    digit-0: ""
    digit-1: ""
    digit-2: ""
    digit-3: ""
    digit-4: ""
    digit-5: ""
    digit-6: ""
    digit-7: ""
    digit-8: ""
    digit-9: ""
    del: ""
    ok: ""
    code-filled: ""
    code-empty: ""
    filler: ""
    change-code: ""
    trusted: ""
    remove: ""
    close: ""
    back: ""
    yes: ""
    no: ""
    scope-one: ""
    scope-all: ""

